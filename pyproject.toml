[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssrf-scanner"
version = "0.1.0"
description = "Modular SSRF scanner: parameter discovery, cloud metadata fingerprinting, bypass encodings and OOB callback detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
lab = ["flask>=3.0"]

[project.scripts]
ssrfscan = "ssrf_scanner.cli:main"

[tool.setuptools.packages.find]
include = ["ssrf_scanner*"]
